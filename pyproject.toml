[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-snapshot"
version = "0.1.0"
description = "Zero-downtime serialize-and-restore memory checkpoint engine for long-horizon agent trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-session-snapshot = "agent_session_snapshot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_session_snapshot*"]
